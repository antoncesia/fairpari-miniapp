<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Закрытый прототип</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#010123;--card:#222249;--ink:#FFFFFF;--muted:#A9ACC9;--blue:#0077FF;--err:#FF6B7A}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--card);border-radius:16px;padding:24px 20px}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.45}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;height:46px;border-radius:10px;border:1px solid #3A3A6A;background:#14143A;color:var(--ink);font-size:16px;padding:0 14px}
input[type=password]:focus{outline:2px solid var(--blue);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:var(--muted)}
.row input{width:18px;height:18px;accent-color:var(--blue)}
button{width:100%;height:46px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;margin-top:12px;font-size:13.5px;color:var(--err)}
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <h1>Закрытый прототип</h1>
  <p>Доступ только для команды проекта. Введите пароль, который вам передали.</p>
  <label for="pw">Пароль</label>
  <input type="password" id="pw" required autofocus>
  <div class="row"><input type="checkbox" id="remember" checked><label for="remember" style="margin:0">Запомнить на этом устройстве</label></div>
  <button type="submit" id="go">Открыть</button>
  <div class="msg" id="msg" role="alert"></div>
</form>

const ITER=310000;
const KEY="proto-pass";
try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
async function unlock(pw){
  const raw=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct));
  document.open(); document.write(html); document.close();
}
const form=document.getElementById("gate"), pw=document.getElementById("pw"), msg=document.getElementById("msg"), go=document.getElementById("go"), rem=document.getElementById("remember");
async function attempt(value, fromStorage){
  go.disabled=true; msg.textContent=""; go.textContent="Проверяем…";
  try{
    await unlock(value);
    if(!fromStorage){ try{ rem.checked?localStorage.setItem(KEY,value):localStorage.removeItem(KEY); }catch(e){} }
  }catch(e){
    if(fromStorage){ try{ localStorage.removeItem(KEY); }catch(_){} }
    else msg.textContent="Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.";
    go.disabled=false; go.textContent="Открыть"; pw.select();
  }
}
form.addEventListener("submit",e=>{ e.preventDefault(); if(pw.value) attempt(pw.value,false); });
if(!window.crypto||!crypto.subtle){ msg.textContent="Браузер не поддерживает расшифровку. Откройте страницу по https в современном браузере."; go.disabled=true; }
else { let saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){} if(saved) attempt(saved,true); }
</script>
